name: flutter_ota_kit
description: Open-source, self-hosted code push (OTA updates) for Flutter Android. Patches Dart AOT libapp.so and assets on cold start with integrity checks and crash rollback.
version: 0.1.4
homepage: https://github.com/HYPER12755/flutter_ota_kit
repository: https://github.com/HYPER12755/flutter_ota_kit
issue_tracker: https://github.com/HYPER12755/flutter_ota_kit/issues
documentation: https://github.com/HYPER12755/flutter_ota_kit#readme
license: MIT

topics:
  - flutter
  - android
  - code-push
  - hot-update
  - ota-update

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_ota_kit_core: ^0.1.0
  flutter_ota_kit_client: ^0.1.0
  flutter_ota_kit_supabase: ^0.1.0
  flutter_ota_kit_postgres: ^0.1.0
  flutter_ota_kit_cloudflare: ^0.1.0
  flutter_ota_kit_aws: ^0.1.0
  plugin_platform_interface: '>=2.0.2 <3.0.0'
  # The npm `flutter-ota` CLI (`flutter_ota_kit_cli`) is intentionally NOT a pub
  # dependency; `dart run flutter_ota_kit:pack` is implemented in `lib/src/pack`.
  archive: '>=3.4.10 <5.0.0'
  args: '>=2.4.0 <3.0.0'
  crypto: '>=3.0.3 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flutter_patcher.flutter_patcher
        pluginClass: FlutterPatcherPlugin
