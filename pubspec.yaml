name: flutter_ota_kit
description: Open-source, self-hosted code push (OTA updates) for Flutter Android. Patches Dart AOT libapp.so and assets on cold start with integrity checks and crash rollback.
version: 0.1.12
homepage: https://github.com/HYPER12755/flutter-ota-kit
repository: https://github.com/HYPER12755/flutter-ota-kit
issue_tracker: https://github.com/HYPER12755/flutter-ota-kit/issues
documentation: https://github.com/HYPER12755/flutter-ota-kit#readme
license: MIT

topics:
  - flutter
  - android
  - code-push
  - hot-update
  - ota-update

environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_ota_kit_core: ^0.1.2
  flutter_ota_kit_client: ^0.1.2
  flutter_ota_kit_supabase: ^0.1.4
  flutter_ota_kit_postgres: ^0.1.3
  flutter_ota_kit_cloudflare: ^0.1.3
  flutter_ota_kit_aws: ^0.1.3
  flutter_ota_kit_pocketbase: ^0.1.0
  flutter_ota_kit_plugin_core: ^0.0.4
  plugin_platform_interface: '>=2.0.2 <3.0.0'
  package_info_plus: ^10.0.0
  restart_app: ^1.9.1
  # The npm `flutter-ota` CLI (`flutter_ota_kit_cli`) is intentionally NOT a pub
  # dependency; `dart run flutter_ota_kit:pack` is implemented in `lib/src/pack`.
  archive: ^4.0.0
  args: '>=2.4.0 <3.0.0'
  crypto: '>=3.0.3 <4.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# During monorepo development, resolve the intra-monorepo packages to their
# local copies rather than the hosted (pub.dev) versions. On release each
# package is published at the version declared above; consumers then resolve
# the hosted versions. Keeps `dependencies` publishable (no `path:` deps there)
# so `invalid_dependency` stays clean while local dev always uses in-repo code.
dependency_overrides:
  flutter_ota_kit_core:
    path: packages/core
  flutter_ota_kit_client:
    path: packages/client
  flutter_ota_kit_supabase:
    path: plugins/supabase
  flutter_ota_kit_postgres:
    path: plugins/postgres
  flutter_ota_kit_cloudflare:
    path: plugins/cloudflare
  flutter_ota_kit_aws:
    path: plugins/aws
  flutter_ota_kit_pocketbase:
    path: plugins/pocketbase
  flutter_ota_kit_plugin_core:
    path: plugins/plugin-core

flutter:
  plugin:
    platforms:
      android:
        package: com.flutter_patcher.flutter_patcher
        pluginClass: FlutterPatcherPlugin
