name: flutter_patcher_client
description: Server-API client for flutter_patcher — maps the hot-updater-compatible update-check HTTP contract to a PatchInfo the device SDK can install.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter_patcher_core:
    path: ../../packages/core

dev_dependencies:
  flutter_patcher_server:
    path: ../../packages/server
  flutter_patcher_cloudflare:
    path: ../../plugins/cloudflare
  flutter_patcher_plugin_core:
    path: ../../plugins/plugin-core
  crypto: ^3.0.3
  test: ^1.25.0
  lints: ^4.0.0
  shelf: ^1.4.0
