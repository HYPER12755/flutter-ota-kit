name: flutter_ota_kit_client
description: Server-API client for flutter_ota_kit — maps the hot-updater-compatible update-check HTTP contract to a PatchInfo the device SDK can install.
version: 0.1.0
homepage: https://github.com/HYPER12755/flutter-ota-kit
repository: https://github.com/HYPER12755/flutter-ota-kit
issue_tracker: https://github.com/HYPER12755/flutter-ota-kit/issues
documentation: https://github.com/HYPER12755/flutter-ota-kit#readme
license: MIT

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  flutter_ota_kit_core: ^0.1.0

dev_dependencies:
  flutter_ota_kit_cloudflare: ^0.1.1
  flutter_ota_kit_plugin_core: ^0.0.2
  crypto: ^3.0.3
  test: ^1.25.0
  lints: ^4.0.0
  shelf: ^1.4.0

dependency_overrides:
  flutter_ota_kit_core:
    path: ../core
  flutter_ota_kit_cloudflare:
    path: ../../plugins/cloudflare
  flutter_ota_kit_plugin_core:
    path: ../../plugins/plugin-core
