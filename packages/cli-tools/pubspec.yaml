name: flutter_ota_kit_cli
description: >-
  Command-line interface for flutter_ota_kit (a hot-updater compatible OTA code
  push tool for Flutter). Deploy bundles, manage channels/rollbacks, run
  migrations, and inspect the backend — mirroring the `hot-updater` CLI UX.
version: 0.1.1
publish_to: none

environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  args: '>=2.4.0 <3.0.0'
  crypto: '>=3.0.3 <4.0.0'
  path: ^1.9.0
  archive: ^4.0.0
  collection: ^1.18.0
  cryptography: ^2.7.0
  postgres: ^3.4.0
  # All former sub-packages (core, plugin-core, backends) now live inside the
  # merged `flutter_ota_kit` package under lib/src/pkg/. The CLI depends on the
  # single package instead of eight. NOTE: `flutter_ota_kit` is a Flutter plugin,
  # so building the CLI now requires the Flutter SDK (not just the Dart SDK).
  flutter_ota_kit: ^0.2.0
  http: ^1.2.0
  shelf: ^1.4.0

dev_dependencies:
  test: ^1.25.0

dependency_overrides:
  flutter_ota_kit:
    path: ../..
