name: flutter_ota_kit_example
description: "Example app demonstrating flutter_ota_kit OTA updates."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_ota_kit:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Monorepo dev: the parent plugin resolves its intra-monorepo packages via
# `dependency_overrides` against local paths. Mirror those here so the example
# resolves consistently.
dependency_overrides:
  flutter_ota_kit_pocketbase:
    path: ../plugins/pocketbase

flutter:
  uses-material-design: true
